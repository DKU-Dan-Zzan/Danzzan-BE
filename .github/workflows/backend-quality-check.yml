name: Backend Quality Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable test configuration; no repository secrets or production services.
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder
      DEEPL_API_KEY: ci-placeholder
      JWT_SECRET: ci-placeholder-secret-at-least-32-characters-long
      DB_URL: jdbc:mysql://127.0.0.1:3306/ci_placeholder
      DB_USERNAME: ci-placeholder
      DB_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Test and build
        run: ./gradlew clean test bootJar --no-daemon --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
          retention-days: 7
