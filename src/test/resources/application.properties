spring.profiles.default=test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

jwt.secret=test-secret-key-for-jwt-at-least-32-characters-long
jwt.access-validity-ms=3600000
jwt.refresh-validity-ms=604800000
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

app.cors.allowed-origins=http://localhost:5173

password-reset.code-ttl-sec=300
password-reset.verify-token-ttl-sec=600
password-reset.max-verify-attempts=5
password-reset.resend-cooldown-sec=60
password-reset.max-request-per-window=10
password-reset.request-rate-window-sec=600
password-reset.mail.subject=[TEST] 비밀번호 재설정 인증코드
password-reset.mail.from=test@danzzan.com
