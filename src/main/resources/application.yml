server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:1000}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:100}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:2000}

spring:
  application:
    name: danzzan-be

  datasource:
    url: ${DB_URL:jdbc:mysql://05436352-5959-4640-9a69-3070c16e0a36.external.kr1.mysql.rds.nhncloudservice.com:3306/festival_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:danzzan}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 600000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:200}
          max-idle: ${REDIS_POOL_MAX_IDLE:50}
          min-idle: ${REDIS_POOL_MIN_IDLE:20}
          max-wait: 1000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ticket-issue-consumer-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:danzzan2026@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

jwt:
  secret: ${JWT_SECRET}
  access-validity-ms: 3600000
  refresh-validity-ms: 604800000
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  ticketing:
    async:
      reserve:
        enabled: ${TICKETING_ASYNC_RESERVE_ENABLED:false}
        shadow-publish:
          enabled: ${TICKETING_ASYNC_RESERVE_SHADOW_PUBLISH_ENABLED:false}
        rollout-percent: ${TICKETING_ASYNC_RESERVE_ROLLOUT_PERCENT:0}
        allowed-event-ids: ${TICKETING_ASYNC_RESERVE_ALLOWED_EVENT_IDS:}
        processing-ttl-seconds: ${TICKETING_ASYNC_RESERVE_PROCESSING_TTL_SECONDS:600}
        failed-ttl-seconds: ${TICKETING_ASYNC_RESERVE_FAILED_TTL_SECONDS:300}
    max-concurrent-slots: ${APP_TICKETING_MAX_CONCURRENT_SLOTS:2000}
    gate-ttl-seconds: ${APP_TICKETING_GATE_TTL_SECONDS:120}
    active-ttl-seconds: ${APP_TICKETING_ACTIVE_TTL_SECONDS:600}
    expire:
      batch-size: ${TICKETING_EXPIRE_BATCH_SIZE:100}
    direct-admission:
      active-ttl-seconds: ${TICKETING_DIRECT_ADMISSION_ACTIVE_TTL_SECONDS:90}
    admission:
      fixed-delay-ms: ${TICKETING_ADMISSION_FIXED_DELAY_MS:300}
      batch-ceiling: ${TICKETING_ADMISSION_BATCH_CEILING:200}
      max-batch-per-tick: ${TICKETING_ADMISSION_MAX_BATCH_PER_TICK:200}
    outbox:
      publisher:
        fixed-delay-ms: ${TICKETING_OUTBOX_PUBLISHER_FIXED_DELAY_MS:100}
        batch-size: ${TICKETING_OUTBOX_PUBLISHER_BATCH_SIZE:500}
    kafka:
      consumer:
        concurrency: ${TICKETING_KAFKA_CONSUMER_CONCURRENCY:3}
      topics:
        issue-requested: ticket.issue.requested.v1
        issue-requested-dlq: ticket.issue.requested.v1.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /internal/actuator
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: danzzan-be
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

password-reset:
  code-ttl-sec: ${PASSWORD_RESET_CODE_TTL_SEC:300}
  verify-token-ttl-sec: ${PASSWORD_RESET_VERIFY_TOKEN_TTL_SEC:600}
  max-verify-attempts: ${PASSWORD_RESET_MAX_VERIFY_ATTEMPTS:5}
  resend-cooldown-sec: ${PASSWORD_RESET_RESEND_COOLDOWN_SEC:60}
  max-request-per-window: ${PASSWORD_RESET_MAX_REQUEST_PER_WINDOW:10}
  request-rate-window-sec: ${PASSWORD_RESET_REQUEST_RATE_WINDOW_SEC:600}
  mail:
    subject: ${PASSWORD_RESET_MAIL_SUBJECT:[DANZZAN] 2026 DANFESTA 비밀번호 재설정 인증코드}
    from: ${PASSWORD_RESET_MAIL_FROM:${MAIL_USERNAME:danzzan2026@gmail.com}}

phone-verification:
  code-ttl-sec: ${PHONE_VERIFICATION_CODE_TTL_SEC:300}
  max-verify-attempts: ${PHONE_VERIFICATION_MAX_VERIFY_ATTEMPTS:5}
  create-cooldown-sec: ${PHONE_VERIFICATION_CREATE_COOLDOWN_SEC:60}
  max-create-requests-per-window: ${PHONE_VERIFICATION_MAX_CREATE_REQUESTS_PER_WINDOW:5}
  create-rate-window-sec: ${PHONE_VERIFICATION_CREATE_RATE_WINDOW_SEC:600}
  cleanup-retention-sec: ${PHONE_VERIFICATION_CLEANUP_RETENTION_SEC:3600}
  scheduler-fixed-delay-ms: ${PHONE_VERIFICATION_SCHEDULER_FIXED_DELAY_MS:60000}
  status-poll-hint-sec: ${PHONE_VERIFICATION_STATUS_POLL_HINT_SEC:5}
  message-template: ${PHONE_VERIFICATION_MESSAGE_TEMPLATE:%s}
  code-encryption-secret: ${CODE_ENCRYPTION_SECRET:}
  octomo:
    receive-number: ${OCTOMO_RECEIVE_NUMBER:16663538}

octomo:
  base-url: https://api.octoverse.kr
  message-exists-path: /octomo/v1/public/message/exists
  api-key: ${OCTOMO_API_KEY:}

nhn:
  object-storage:
    endpoint: ${NHN_OBJECT_STORAGE_ENDPOINT:https://kr1-api-object-storage.nhncloudservice.com}
    region: ${NHN_OBJECT_STORAGE_REGION:kr-standard}
    access-key: ${NHN_OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${NHN_OBJECT_STORAGE_SECRET_KEY:}
    container: ${NHN_OBJECT_STORAGE_CONTAINER:danzzan-bucket}
    public-read: false
    presign:
      put-expiration-sec: 300
